name: Deploy COD proxy worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/cod-proxy/**'
      - '.github/workflows/deploy-cod-proxy.yml'

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COD_NETWORK_TOKEN: ${{ secrets.COD_NETWORK_TOKEN }}
        working-directory: workers/cod-proxy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skip: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          printf '%s' "$COD_NETWORK_TOKEN" | wrangler secret put COD_NETWORK_TOKEN
          wrangler deploy

      - name: Print worker URL
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/cod-proxy
        run: wrangler deployments list --limit 1
