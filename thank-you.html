<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك | نسمة هوم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-ar">نسمة هوم</span>
                <span class="logo-en">NASMA HOME</span></a>
        </div>
    </header>

    <main class="thank-page">
        <div class="thank-card">
            <div class="thank-icon">✓</div>
            <h1>تم استلام طلبك بنجاح</h1>
            <p>شكراً لثقتك بـ نسمة هوم — سيتواصل فريقنا قريباً لتأكيد العنوان والباقة.</p>
            <p class="thank-detail" id="thankDetail"></p>
            <a href="index.html" class="btn btn-primary">العودة للمتجر</a>
        </div>
    </main>

    <script>
        (function () {
            var p = new URLSearchParams(window.location.search);
            var product = p.get('product') || '';
            var bundle = p.get('bundle') || '';
            var price = p.get('price') || '';
            var el = document.getElementById('thankDetail');
            if (el && (product || bundle || price)) {
                el.textContent = [product, bundle, price ? price + ' ر.س' : ''].filter(Boolean).join(' · ');
            }
        })();
    </script>
</body>
</html>
