<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك | نسمة هوم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="images/nasma-home-logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="نسمة هوم — Nasma Home">
                <img src="images/nasma-home-logo.png" alt="" class="logo-img" width="130" height="52">
            </a>
        </div>
    </header>

    <main class="thank-page">
        <div class="thank-card">
            <div class="thank-icon">✓</div>
            <h1>تم استلام طلبك بنجاح</h1>
            <p>شكراً لثقتك بـ نسمة هوم — سيتواصل فريقنا أو مركز تأكيد COD Network قريباً لتأكيد العنوان والباقة. الدفع عند الاستلام.</p>
            <p class="thank-detail" id="thankDetail"></p>
            <a href="index.html" class="btn btn-primary">العودة للمتجر</a>
        </div>
    </main>

    <script>
        (function () {
            var p = new URLSearchParams(window.location.search);
            var product = p.get('product') || '';
            var bundle = p.get('bundle') || '';
            var price = p.get('price') || '';
            var ref = p.get('ref') || '';
            var el = document.getElementById('thankDetail');
            if (el && (product || bundle || price || ref)) {
                var parts = [product, bundle, price ? price + ' ر.س' : ''].filter(Boolean);
                if (ref) parts.push('مرجع COD: ' + ref);
                el.textContent = parts.join(' · ');
            }
        })();
    </script>
</body>
</html>
